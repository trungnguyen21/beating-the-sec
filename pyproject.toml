[project]
name = "beating-sec"
version = "0.1.0"
description = "Low-latency SEC filing analyzer"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.1",
    "asyncio>=4.0.0",
    "beautifulsoup4>=4.15.0",
    "feedparser>=6.0.12",
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "pydantic>=2.13.4",
    "pymupdf>=1.27.2.3",
    "python-dotenv>=1.2.2",
    "redis>=8.0.0",
    "google-genai>=1.0.0",
    "sec-downloader>=0.12.2",
    "yfinance>=1.4.1",
    "lxml>=6.1.1",
    "aiokafka>=0.14.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "jinja2>=3.1.0",
    "psycopg[binary,pool]>=3.2.0",
    "python-multipart>=0.0.20",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "discord-py>=2.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: hits a real external service (SEC, Gemini, Kafka, Discord) — requires network/credentials, excluded by default",
]

